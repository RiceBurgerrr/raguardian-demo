<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAGuard 시연</title>
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F1EA;--surface:#FAF8F3;--surface-2:#ECE8DE;--line:#DDD6C8;--line-strong:#C9C2B2;
  --ink:#221D17;--muted:#6F685C;--faint:#958D7F;
  --red:#B8362A;--red-bright:#CF3B2C;--red-soft:#F3DCD6;--red-mid:#E6B6AB;
  --green:#2F6B45;--green-soft:#DDE7D9;--amber:#F2E2B6;
  --mono:SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:20px 20px calc(32px + env(safe-area-inset-bottom))}
.wm{font-family:"Archivo Black","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1}
.wm .g{background:linear-gradient(90deg,var(--ink) 0 50%,var(--red-bright) 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm .u{color:var(--red-bright)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{border:0;background:none;color:var(--muted);font-size:14px;padding:12px 0;cursor:pointer}
.eyebrow{font-size:12px;font-weight:700;color:var(--red)}
.eyebrow.ok{color:var(--green)}
.rule{border-bottom:2px solid var(--ink);padding-bottom:6px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
section{display:flex;flex-direction:column;gap:10px;margin-top:24px}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.3}
.lead{font-size:20px;font-weight:700;line-height:1.4;margin:0}
p{margin:0;font-size:14px;line-height:1.65}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.kpi .k{font-size:11px;color:var(--muted)} .kpi .v{font-size:21px;font-weight:900} .kpi .v small{font-size:12px} .kpi .s{font-size:12px;color:var(--muted)} .kpi .s.ok{color:var(--green);font-weight:700}
.steps{display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps div{display:flex;gap:12px} .steps b{width:16px;flex:none}
.cta{display:block;width:100%;border:0;background:var(--red);color:#fff;font-size:16px;font-weight:700;padding:16px 0;cursor:pointer;margin-top:28px;text-align:center;text-decoration:none}
.cta.dark{background:var(--ink)}
.foot{font-size:11px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.6}
.qbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);padding:11px 12px;min-height:56px;cursor:pointer}
.qbtn:active{background:var(--surface-2)}
.qbtn .no{font-size:12px;font-weight:900;color:var(--faint);width:20px;flex:none}
.qbtn .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.qbtn .ko{font-size:15px;font-weight:700} .qbtn .en{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:700;border:1px solid var(--line-strong);color:var(--muted);padding:1px 5px;border-radius:2px;flex:none}
.chev{color:var(--faint);font-size:18px}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:18px;font-size:10px;color:var(--faint);text-align:center}
.stepper div{display:flex;flex-direction:column;gap:4px;transition:color .3s}
.stepper i{display:block;height:3px;background:var(--line);transition:background .3s}
.stepper .on{color:var(--ink);font-weight:700} .stepper .on i{background:var(--ink)}
.stepper .on.r i{background:var(--red)} .stepper .on.gr i{background:var(--green)}
.doc{display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-bottom:1px solid var(--line);background:transparent;transition:opacity .5s cubic-bezier(.22,.8,.24,1),transform .5s cubic-bezier(.22,.8,.24,1),background .7s ease,box-shadow .7s ease;overflow:hidden}
.doc .rk,.doc .id,.doc .snip,.doc .dtxt{transition:color .7s ease}
.doc .row{display:flex;align-items:center;gap:10px}
.doc .rk{font-weight:900;width:30px;flex:none;font-size:14px}
.doc .id{font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dtxt{flex:1;min-width:0;font-size:12px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .snip{font-size:11px;color:var(--faint);line-height:1.45;padding-left:40px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.doc.atk{background:var(--red-soft);border-bottom-color:var(--red-mid)} .doc.atk .rk,.doc.atk .id{color:var(--red)}
.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:2px;flex:none;white-space:nowrap}
.badge.red{background:var(--red);color:#fff} .badge.line{border:1px solid var(--line-strong);color:var(--muted)}
.badge.pass{border:1px solid var(--green);color:var(--green)} .badge.green{background:var(--green);color:#fff}
.badge.redline{border:1px solid var(--red);color:var(--red)}
.peek{border:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer;flex:none;border-radius:2px;min-height:28px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding-left:40px}
.chip{font-size:10px;border:1px solid var(--red-mid);padding:2px 5px;color:var(--ink);background:var(--surface)}
section.pre{display:none}
section.enter{animation:fadeUp .6s cubic-bezier(.22,.8,.24,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.badge{animation:badgeIn .35s cubic-bezier(.22,.8,.24,1) both}
@keyframes badgeIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.doc.pre{opacity:0;transform:translateY(10px)}
.doc.detect{animation:pulse 1.1s ease-in-out 2 both}
@keyframes pulse{0%,100%{background:var(--red-soft);box-shadow:inset 0 0 0 0 rgba(184,54,42,0)}50%{background:#EDBDB2;box-shadow:inset 0 0 0 2px rgba(184,54,42,.55)}}
.doc.gone{opacity:0;transform:translateX(70%) rotate(3deg);max-height:0;padding-top:0;padding-bottom:0;border-bottom-width:0}
.doc.fill{background:var(--green-soft)} .doc.fill .rk{color:var(--green)}
.doc.rise{opacity:0;transform:translateY(18px)}
.stamp{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg) scale(1.6);border:2px solid var(--red);color:var(--red);font-weight:900;font-size:13px;padding:2px 8px;opacity:0;transition:transform .4s cubic-bezier(.34,1.45,.64,1),opacity .3s ease;background:var(--red-soft);pointer-events:none}
.stamp.show{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}
.ans{border:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;transition:opacity .4s,transform .4s}
.ans.red{background:var(--red-soft);border-color:var(--red-mid)} .ans.ok{border-color:var(--green)}
.ans .ko{font-size:16px;line-height:1.6} .ans .en{font-size:11px;color:var(--muted);line-height:1.5}
.note{font-size:12px;font-weight:700}
.note.red{color:var(--red)} .note.ok{color:var(--green)}
.tbar{display:flex;flex-direction:column;gap:6px;font-size:12px}
.tbar .l{display:flex;justify-content:space-between;gap:8px}
.track{height:6px;background:var(--line);display:flex;overflow:hidden}
.track span{display:block;height:6px;width:0;transition:width .8s ease}
.btns{display:flex;gap:8px;margin-top:24px}
.btns button{flex:1;padding:14px 0;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:transparent}
.btns button.fill{background:var(--ink);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(34,29,23,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);padding:12px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;z-index:21;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .3s ease}
.grab{align-self:center;width:40px;height:4px;background:var(--line-strong)}
.anat{background:var(--surface);border:1px solid var(--line);padding:14px;font-size:14px;line-height:1.8}
.anat span{padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.p1{background:var(--surface-2)} .p2{background:var(--amber)} .p3{background:var(--ink);color:var(--bg);font-weight:700}
.legend{display:flex;flex-direction:column;gap:12px}
.legend div{display:flex;gap:10px;align-items:flex-start}
.legend i{width:14px;height:14px;flex:none;margin-top:3px;border:1px solid var(--line-strong)}
.legend b{display:block;font-size:14px} .legend small{font-size:12px;color:var(--muted);line-height:1.5}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line-strong)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;font-weight:700}
.chart span{display:block;width:100%}
.clab{display:flex;gap:6px} .clab div{flex:1;text-align:center;font-size:10px;color:var(--muted);line-height:1.3}

.scene{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.scene .cap{font-size:14px;font-weight:700;line-height:1.5;display:flex;gap:8px}
.scene .cap b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.scene .stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tiles{display:flex;gap:5px}
.tile{width:30px;height:38px;border:1px solid var(--line-strong);background:#fff linear-gradient(var(--line) 0 0) 6px 9px/18px 2px no-repeat,linear-gradient(var(--line) 0 0) 6px 16px/14px 2px no-repeat,linear-gradient(var(--line) 0 0) 6px 23px/18px 2px no-repeat;position:relative;flex:none}
.tile.trap{background:var(--red-soft);border-color:var(--red)}
.tile.trap::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:900;font-size:18px}
.tile.out{opacity:.35;border-style:dashed}
.tile.out::before{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:var(--red);transform:rotate(-40deg)}
.tile.new{background:var(--green-soft);border-color:var(--green)}
.tile.new::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:900;font-size:18px}
.arrow{color:var(--faint);font-size:16px}
.bot{width:30px;height:30px;flex:none}
.bubble{font-size:13px;line-height:1.45;padding:8px 11px;border-radius:12px;background:var(--surface-2);position:relative;flex:1;min-width:150px}
.bubble.red{background:var(--red-soft);color:var(--red);font-weight:700}
.bubble.ok{background:var(--green-soft);color:var(--green);font-weight:700}
.shield{font-size:11px;font-weight:700;color:#fff;background:var(--ink);padding:3px 7px;border-radius:2px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;list-style:none;min-height:32px;display:flex;align-items:center}
details.more summary::after{content:"＋";margin-left:auto;color:var(--faint)}
details.more[open] summary::after{content:"－"}
details.more .in{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.paper{display:block;background:var(--surface);border:1px solid var(--line);padding:12px 14px;text-decoration:none;color:var(--ink)}
.paper .pt{font-size:13px;font-weight:700;line-height:1.45}
.paper .pa{font-size:11px;color:var(--muted);margin-top:4px}
.paper .pl{font-size:12px;color:var(--red);font-weight:700;margin-top:6px}
.summary{background:var(--ink);color:var(--bg);padding:12px 14px;font-size:14px;line-height:1.55;margin-top:14px}
.summary b{color:#F2B8AE} .summary i{font-style:normal;color:#A9D3B5;font-weight:700}

.dicon{width:26px;height:33px;flex:none;display:block}
.drow{display:flex;gap:5px;align-items:flex-end}
.who{width:30px;height:30px;flex:none}
.qb{font-size:13px;font-weight:700;padding:8px 11px;border-radius:12px;background:#fff;border:1px solid var(--line-strong)}
.store{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:52px}
.store small,.dlab{font-size:10px;color:var(--muted);line-height:1.2;text-align:center}
.vstack{display:flex;flex-direction:column;gap:4px;align-items:center}

.doc.off{background:var(--surface-2)!important;border-bottom-color:var(--line)!important;opacity:.78}
.doc.off .rk,.doc.off .id{color:var(--faint)!important;text-decoration:line-through}
.doc.off .snip{color:var(--faint)!important}
.doc.off .stamp{opacity:0;transform:translateY(-50%) rotate(-8deg) scale(.9)}
.same{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#fff;border:1px dashed var(--line-strong);padding:5px 9px;border-radius:12px;align-self:flex-start}
.same b{font-size:10px;color:var(--muted);font-weight:700}
.trapq{font-size:11px;color:var(--red);line-height:1.4}

.sigs{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.sig{display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.45;color:var(--muted)}
.sig .chip{flex:none;min-width:92px;text-align:center}

.reveal{border:0;font:inherit;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:2px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.p3.shown{background:#5A1E18;color:#FBE9E5;font-weight:500;animation:badgeIn .35s ease both}
.rvko{font-size:12px;line-height:1.6;background:var(--red-soft);border:1px solid var(--red-mid);padding:10px 12px}
.rvko b{color:var(--red)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<script src="replay.js"></script>
<script src="translations.js"></script>
<script src="docs.js"></script>
<script>
(() => {
  const R = window.RAGUARD_REPLAY || {}, KO = window.RAGUARD_KO_ANSWERS || {}, DOCS = window.RAGUARD_DOCS || {};
  const QUERIES = [
    { qid:"test328", g:"basic", ko:"미국에서 가장 높은 곳은?" },
    { qid:"test243", g:"basic", ko:"타이타닉은 어느 바다에서 침몰했나?" },
    { qid:"test57",  g:"basic", ko:"합스부르크 제국의 수도는?" },
    { qid:"test327", g:"basic", ko:"로마와 관련된 강은?" },
    { qid:"test337", g:"basic", ko:"네덜란드 국기의 색은?" },
    { qid:"test16",  g:"multi", ko:"히로시마에 떨어진 원자폭탄의 이름은?" },
    { qid:"test281", g:"multi", ko:"톰 브래디는 언제부터 패트리어츠 쿼터백이었나?" },
  ].filter(q => R[q.qid]);
  const app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const BOT = '<svg class="bot" viewBox="0 0 30 30" aria-hidden="true" fill="none" stroke="#221D17" stroke-width="1.8"><rect x="5" y="9" width="20" height="15" rx="4"/><circle cx="11.5" cy="16" r="1.6" fill="#221D17"/><circle cx="18.5" cy="16" r="1.6" fill="#221D17"/><path d="M15 9V5M12 5h6M11 21h8"/></svg>';
  const PAPER = `<a class="paper" href="https://arxiv.org/abs/2504.21680" target="_blank" rel="noopener">
          <div class="pt">Hoist with His Own Petard: Inducing Guardrails to Facilitate Denial-of-Service Attacks on Retrieval-Augmented Generation of LLMs</div>
          <div class="pa">Pan Suo, Yu-Ming Shang, San-Chuan Guo, Xi Zhang · arXiv:2504.21680 (2025)</div>
          <div class="pl">원 논문 보기 (MutedRAG) ↗</div></a>`;
  const wm = '<span class="wm">RA<span class="g">G</span><span class="u">uard</span></span>';
  const sleep = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));
  const rankOf = loc => +((loc || "").match(/rank-(\d+)/) || [])[1];
  let run = 0;

  function go(h){ if (location.hash !== h) location.hash = h; else route(); }
  window.addEventListener("hashchange", route);

  function intro(){
    const DOC = (k) => {
      const c = { "": ["#FFFFFF","#B9B1A0","#D6CFC0"], trap: ["#F3DCD6","#B8362A","#E6B6AB"], "trap out": ["#F3DCD6","#B8362A","#E6B6AB"], new: ["#DDE7D9","#2F6B45","#A9C9B2"] }[k];
      const mark = k === "trap" ? '<text x="13" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#B8362A">!</text>'
        : k === "new" ? '<text x="13" y="27.5" text-anchor="middle" font-size="14" font-weight="900" fill="#2F6B45">+</text>'
        : k === "trap out" ? '<text x="13" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#B8362A">!</text><path d="M2 31L24 3" stroke="#B8362A" stroke-width="2"/>' : "";
      const dash = k === "trap out" ? ' stroke-dasharray="3 2" opacity=".45"' : "";
      return `<svg class="dicon" viewBox="0 0 26 33" aria-hidden="true"><g${dash}><path d="M1.5 1.5h15l8 8v22h-23z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.3" stroke-linejoin="round"/><path d="M16.5 1.5v8h8" fill="none" stroke="${c[1]}" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.5 13h12M5.5 17h14M5.5 21h9" stroke="${c[2]}" stroke-width="1.4"/></g>${mark}</svg>`;
    };
    const tiles = (kinds) => '<div class="drow">' + kinds.map(DOC).join("") + '</div>';
    const PERSON = '<svg class="who" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#221D17" stroke-width="1.8"><circle cx="14" cy="9.5" r="4.5"/><path d="M5 25c0-5 4-8.5 9-8.5s9 3.5 9 8.5"/></svg>';
    const THIEF = '<svg class="who" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 9.6C9.7 5.3 12.5 3 16 3s6.3 2.3 7 6.6z" fill="#221D17"/><rect x="8.2" y="10.2" width="15.6" height="2.8" rx=".4" fill="#221D17"/><path d="M9.5 13.4v3c0 4.7 2.9 8.3 6.5 8.3s6.5-3.6 6.5-8.3v-3" fill="#fff" stroke="#221D17" stroke-width="1.6"/><path d="M9.7 14.3h12.6v2.2c0 1.4-1.1 2.4-2.5 2.4-1.2 0-2-.6-2.7-1.3-.6-.6-1.6-.6-2.2 0-.7.7-1.5 1.3-2.7 1.3-1.4 0-2.5-1-2.5-2.4z" fill="#221D17"/><path d="M11.3 15.2h3c0 .9-.6 1.5-1.5 1.5s-1.5-.6-1.5-1.5zM17.7 15.2h3c0 .9-.6 1.5-1.5 1.5s-1.5-.6-1.5-1.5z" fill="#fff"/><path d="M2.5 31.5c.4-3.7 2.8-5.9 6.6-6.9l3.4-.9c1 1.1 2.2 1.7 3.5 1.7s2.5-.6 3.5-1.7l3.4.9c3.8 1 6.2 3.2 6.6 6.9z" fill="#221D17"/></svg>';

          <p class="muted" style="font-size:12px">AI의 안전장치가 함정 속 위험한 요청에 반응해, 답을 거부해 버려요.</p>

          <p class="faint" style="font-size:11px">NQ(BEIR) · Contriever · Llama-3-8B-Instruct · 공격 질의 302개 · 규칙 기반 판정(잠정치)</p>

  }

  function list(){
    const item = (q, i) => `<button class="qbtn" data-q="${q.qid}"><span class="no">${String(i+1).padStart(2,"0")}</span>
      <span class="t"><span class="ko">${esc(q.ko)}</span><span class="en">${esc(R[q.qid].question)}</span></span>
      ${q.g==="multi" ? '<span class="tag">함정 2개</span>' : ""}<span class="chev">›</span></button>`;
    let i = 0;
    const grp = (g, title) => `<section><div class="rule">${title}</div>${QUERIES.filter(q=>q.g===g).map(q=>item(q,i++)).join("")}</section>`;
    app.innerHTML = `<div class="top"><button class="back" id="bk">← 소개</button><span style="font-size:20px">${wm}</span></div>
      <h1 style="margin-top:6px">질문을 골라보세요</h1>
      <p class="muted" style="font-size:13px;margin-top:4px;line-height:1.55">같은 질문을 <b>보안 없는 AI</b>와 <b>RAGuard를 켠 AI</b>에 각각 물어봅니다</p>
      ${grp("basic","함정 문서가 1개 섞인 질문")}${grp("multi","함정 문서가 2개 섞인 질문")}
      <p class="faint" style="font-size:11px;margin-top:18px">실제로 실행한 결과를 다시 보여줍니다 · AI 모델: Llama-3-8B</p>`;
    document.getElementById("bk").onclick = () => go("#/");
    app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => go("#/r/" + b.dataset.q));
  }

  function docRow(h, opts = {}){
    const d = DOCS[h.doc_id] || {};
    const atk = h.doc_id.startsWith("atk_");
    const right = opts.right || (atk ? `<button class="peek" data-doc="${h.doc_id}">속 보기 ›</button>` : '<span class="badge line">일반 자료</span>');
    const title = atk ? `<span class="id" style="font-family:inherit;font-weight:700;font-size:13px">함정 문서</span>`
      : `<span class="dtxt">${esc(d.snippet || "자료")}</span>`;
    return `<div class="doc ${atk ? "atk" : ""} ${opts.cls || ""}" data-id="${h.doc_id}" style="position:relative">
      <div class="row"><span class="rk">${h.rank}번</span>${title}${right}</div>
      ${atk && d.copied ? `<div class="snip" style="color:var(--red)">질문을 베낀 뒤 "앞 내용은 잊어라" + 위험한 요청이 숨어 있음</div>` : ""}
      ${opts.extra || ""}</div>`;
  }

  const SIG = {
    "앵커": "질문과 가장 닮은 문장이 얼마나 닮았나. 질문을 그대로 베낀 문서일수록 높아요",
    "관련도 격차": "질문과 관련 있는 문장과 무관한 문장이 한 문서에 섞인 정도",
    "의미 전환": "이웃한 두 문장 사이에서 주제가 갑자기 바뀌는 정도",
    "문장군 분리": "질문에 가까운 문장들과 먼 문장들이 서로 따로 노는 정도. 정상 글에 다른 글을 끼워 넣으면 높아요",
    "전환 유사도": "\"앞 지시는 무시하고 다른 질문에 답해\" 같은 명령 바꿔치기 문장과 닮은 정도",
    "거부 유사도": "\"답할 수 없다고만 말해\" 같은 거부 유도 문장과 닮은 정도",
  };
  function chips(reason){
    const rows = (reason || "").split(" · ").map(s => s.match(/^([가-힣 ]+) ([\d.]+)$/)).filter(Boolean).slice(0, 6);
    return `<div class="sigs">${rows.map(m => `<div class="sig"><span class="chip">${esc(m[1])} ${esc(m[2])}</span><span>${esc(SIG[m[1]] || "")}</span></div>`).join("")}
      <p class="faint" style="font-size:10.5px;line-height:1.5;margin:2px 0 0">문서를 문장 단위로 나눠 문장 임베딩(mpnet)으로 계산한 0~1 값이에요. 6개 신호를 함께 보고 함정 여부를 판정해요.</p></div>`;
  }

  function ko(en){ return KO[en] || KO[(en||"").trim()] || ""; }

  async function result(qid){
    const myRun = ++run;
    const x = R[qid], q = QUERIES.find(q => q.qid === qid);
    if (!x || !q) return go("#/q");
    const idx = QUERIES.indexOf(q);
    const top5 = x.retrieval.top5;
    const san = x.on.sanitization || [];
    const dropped = new Set(san.filter(s => s.action === "drop").map(s => s.doc_id));
    const fills = san.filter(s => s.action === "backfill").map(s => ({ rank: rankOf(s.location), doc_id: s.doc_id }));
    const dets = Object.fromEntries((x.on.detections || []).map(d => [d.doc_id, d]));
    const nAtk = top5.filter(h => h.doc_id.startsWith("atk_")).length;
    const offKo = ko(x.off.answer), onKo = ko(x.on.answer);
    const T = n => (n || 0).toFixed(2);
    const tm = Object.fromEntries((x.on.timings || []).map(t => [t.label, t.seconds]));
    const det = tm["의미 탐지(C1)"] || 0, fill = tm["청크 제외·재검색 보충"] || 0;
    const llmOn = (x.on.ollama || {}).request_seconds || 0, llmOff = (x.off.ollama || {}).request_seconds || 0;
    const maxT = Math.max(x.on.seconds, x.off.seconds);

    app.innerHTML = `<div class="top"><button class="back" id="bk">← 질문 목록</button><span style="font-size:18px">${wm}</span></div>
      <div class="eyebrow" style="margin-top:4px">Q${String(idx+1).padStart(2,"0")} · ${"함정 문서 "+nAtk+"개가 섞인 질문"}</div>
      <h1 style="margin-top:6px">${esc(q.ko)}</h1>
      <p class="muted" style="font-size:12px;margin-top:4px">${esc(x.question)}</p>
      <div class="summary"><b>보안이 없으면</b> 함정 때문에 답을 못 하고, <i>RAGuard를 켜면</i> 함정을 빼고 제대로 답합니다.</div>

      <section id="s1"><div class="rule">1. AI가 찾아본 자료 5개 <span class="faint" style="font-size:11px;font-weight:400">함정 ${nAtk}개 섞임</span></div>
        <div>${top5.map(h => docRow(h, { cls: "pre" })).join("")}</div></section>

      <section id="s2" class="pre"><div class="rule">2. 보안 없는 AI의 답 <span class="badge red" style="font-size:13px;padding:4px 10px">답변 거부</span></div>
        <div class="ans red"><div class="ko">${esc(offKo || x.off.answer)}</div>${offKo ? `<div class="en">원문 · ${esc(x.off.answer)}</div>` : ""}</div>
        <div class="note red">함정 문서 속 위험한 요청에 반응해서, 평범한 질문에도 답을 거부했어요</div></section>

      <section id="s3" class="pre"><div class="rule">3. RAGuard가 함정 찾기 <span class="faint" style="font-size:11px;font-weight:400">${dropped.size}개 빼고 ${fills.length}개 채움</span></div>
        <div id="proc">${top5.map(h => {
          const d = dets[h.doc_id];
          if (dropped.has(h.doc_id)) return docRow(h, { cls: "", right: '<span class="badge redline">검사 중</span>',
            extra: `<details class="more" style="padding-left:40px;border:0;padding-top:2px"><summary style="font-size:11px;min-height:24px">판단 근거 (전공자용)</summary><div>${chips(d && d.reason)}</div></details><span class="stamp">함정!</span>` });
          return docRow(h, { right: '<span class="badge pass">정상</span>' });
        }).join("")}${fills.map(f => docRow(f, { cls: "fill rise", right: '<span class="badge green">+ 새 자료</span>' })).join("")}</div></section>

      <section id="s4" class="pre"><div class="rule">4. RAGuard를 켠 AI의 답 <span class="badge green" style="font-size:13px;padding:4px 10px">정상 답변</span></div>
        <div class="ans ok"><div class="ko">${esc(onKo || x.on.answer)}</div>${onKo ? `<div class="en">원문 · ${esc(x.on.answer)}</div>` : ""}</div>
        <div class="note ok">함정을 빼고 새 자료로 채우니 제대로 답했어요</div></section>

      <section id="s5" class="pre"><div class="rule">보안 검사에 걸린 시간</div>
        <p style="font-size:14px">RAGuard가 함정을 찾고 자료를 바꾸는 데 <b>${T(det + fill)}초</b>가 더 걸렸어요.</p>
        <details class="more"><summary>시간 자세히</summary><div class="in"><div class="tbar">
          <div class="l"><span class="muted">보안 없음</span><b>${T(x.off.seconds)}초</b></div>
          <div class="track"><span data-w="${llmOff/maxT*100}" style="background:var(--ink)"></span></div>
          <div class="l"><span class="muted">RAGuard (함정 찾기 ${T(det)} · 채우기 ${T(fill)} 포함)</span><b>${T(x.on.seconds)}초</b></div>
          <div class="track"><span data-w="${det/maxT*100}" style="background:var(--red-mid)"></span><span data-w="${fill/maxT*100}" style="background:var(--green)"></span><span data-w="${llmOn/maxT*100}" style="background:var(--ink)"></span></div>
          <div class="faint" style="font-size:11px">답변 생성: RunPod 서버리스 GPU · 함정 찾기: CPU</div>
        </div></div></details></section>

      <div class="btns"><button id="replay">다시 재생</button><button class="fill" id="next">${idx < QUERIES.length-1 ? "다음 질문 →" : "실험 결과 →"}</button></div>`;

    document.getElementById("bk").onclick = () => go("#/q");
    document.getElementById("replay").onclick = () => result(qid);
    document.getElementById("next").onclick = () => go(idx < QUERIES.length-1 ? "#/r/" + QUERIES[idx+1].qid : "#/stats");
    app.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => sheet(b.dataset.doc));
    window.scrollTo(0, 0);

    const alive = () => myRun === run;
    const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const follow = el => {
      const r = el.getBoundingClientRect();
      if (r.top > innerHeight * 0.55 || r.top < 0) window.scrollTo({ top: r.top + scrollY - 72, behavior: "smooth" });
    };
    const reveal = id => { const el = document.getElementById(id); el.classList.remove("pre"); el.classList.add("enter"); follow(el); };

    // 1. 자료 5개: 한 번에 시차를 두고 부드럽게 등장
    const s1rows = [...document.querySelectorAll("#s1 .doc")];
    s1rows.forEach((el, i) => el.style.transitionDelay = (i * 110) + "ms");
    await nextFrame(); if (!alive()) return;
    s1rows.forEach(el => el.classList.remove("pre"));
    await sleep(s1rows.length * 110 + 700); if (!alive()) return;
    s1rows.forEach(el => el.style.transitionDelay = "");

    // 2. 보안 없는 AI의 답
    reveal("s2");
    await sleep(1900); if (!alive()) return;

    // 3. 함정 찾기
    reveal("s3");
    await sleep(750); if (!alive()) return;
    const procRows = [...document.querySelectorAll("#proc .doc:not(.fill)")];
    const traps = procRows.filter(el => dropped.has(el.dataset.id));
    traps.forEach((el, k) => { el.style.animationDelay = (k * 300) + "ms"; el.classList.add("detect"); });
    await sleep(1100 + (traps.length - 1) * 300); if (!alive()) return;
    for (const el of traps) {
      el.querySelector(".stamp").classList.add("show");
      const bd = el.querySelector(".badge"); if (bd) bd.outerHTML = '<span class="badge red">함정 발견</span>';
      await sleep(260); if (!alive()) return;
    }
    await sleep(1100); if (!alive()) return;

    // 회색으로 바래며 제외
    traps.forEach(el => {
      el.classList.remove("detect"); el.style.animationDelay = ""; el.classList.add("off");
      const bd = el.querySelector(".badge"); if (bd) bd.outerHTML = '<span class="badge line">제외됨</span>';
      const t = el.querySelector(".id"); if (t) t.textContent = "함정 문서 (제외됨)";
    });
    await sleep(650); if (!alive()) return;

    // 새 자료가 아래에서 차례로 올라옴
    const fillsEl = [...document.querySelectorAll("#proc .doc.fill")];
    fillsEl.forEach((el, i) => el.style.transitionDelay = (i * 160) + "ms");
    await nextFrame(); if (!alive()) return;
    fillsEl.forEach(el => el.classList.remove("rise"));
    await sleep(fillsEl.length * 160 + 1000); if (!alive()) return;

    // 4. RAGuard를 켠 AI의 답
    reveal("s4");
    await sleep(1000); if (!alive()) return;
    reveal("s5");
    document.querySelectorAll("#s5 .track span").forEach(s => s.style.width = Math.max(0, +s.dataset.w).toFixed(1) + "%");
  }

  const sheetEl = document.getElementById("sheet"), bg = document.getElementById("sheetBg");
  function closeSheet(){ sheetEl.classList.remove("open"); bg.classList.remove("open"); }
  bg.onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  function sheet(id){
    const d = DOCS[id]; if (!d) return;
    sheetEl.innerHTML = `<div class="grab"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div><div class="eyebrow">${esc(id)}</div><div id="sheetTitle" style="font-size:21px;font-weight:900;margin-top:4px">함정 문서 속을 보면</div></div>
        <button class="back" id="cls" style="padding:10px 4px">닫기</button></div>
      <div class="anat"><span class="p1">${esc(d.copied)}</span> <span class="p2">${esc(d.inject)}</span> ${d.payload
          ? `<button class="p3 reveal" id="rv" aria-expanded="false">[위험한 요청 — 눌러서 보기]</button>`
          : `<span class="p3">[위험한 요청 — 가림]</span>`} <span class="p1">${esc(d.tail)}</span></div>
      <div id="rvko" class="rvko" hidden></div>
      ${d.blocked ? '<p class="faint" style="font-size:11px">이 요청은 내용이 지나치게 위험해 공개하지 않아요.</p>' : ""}
      <div class="legend">
        <div><i class="p1"></i><span><b>① 질문 따라 쓰기</b><small>질문을 그대로 베껴 써서, AI가 이 문서를 "관련 자료"로 착각해 가져와요</small></span></div>
        <div><i class="p2"></i><span><b>② 명령 바꿔치기</b><small>"앞 내용은 잊고 새 질문에 집중해" 라고 AI에게 지시해요</small></span></div>
        <div><i class="p3"></i><span><b>③ 위험한 요청</b><small>AI의 안전장치가 이 문장을 보고 "답하면 안 된다"고 판단해요${d.payload ? " (눌러서 볼 수 있어요)" : " (가림)"}</small></span></div>
      </div>
      <p style="border-top:1px solid var(--line);padding-top:12px;font-size:13px">공격자의 목적은 위험한 답을 얻는 게 아니라, AI가 <b style="color:var(--red)">아무 답도 못 하게</b> 만드는 거예요. 이런 공격을 가용성 공격(DoS)이라고 불러요.</p>`;
    sheetEl.classList.add("open"); bg.classList.add("open");
    document.getElementById("cls").onclick = closeSheet;
    const rv = document.getElementById("rv");
    if (rv) rv.onclick = () => {
      const s = document.createElement("span"); s.className = "p3 shown"; s.textContent = d.payload;
      rv.replaceWith(s);
      const ko = document.getElementById("rvko");
      ko.innerHTML = `<b>요청 뜻</b> ${esc(d.payload_ko)}<br><span class="faint">AI가 거부하도록 넣은 요청 문장이며, 실제로 하는 방법은 들어 있지 않아요.</span>`;
      ko.hidden = false;
    };
  }

  function stats(){
    const bar = (v, l, c) => ({ v, l, c });
    const charts = [
      { tag:"실험 1 · 함정이 얼마나 위험한가", t:"함정 문서 비율에 따른 답변 거부율 (%)", bars:[[3.6,"0%"],[4.6,"1%"],[6.0,"3%"],[7.6,"5%"],[11.6,"10%"],[19.5,"20%"],[43.4,"50%"],[83.4,"100%"]].map(([v,l]) => bar(v,l, v>40?"var(--red)":"var(--line-strong)")),
        take:"함정 문서를 넣은 질문이 많아질수록, AI가 답을 거부하는 비율이 가파르게 올라가요 (3.6% → 83.4%)." },
      { tag:"실험 2 · 함정 찾기", t:"보안 방식별 답변 거부율 (%)", bars:[bar(83.4,"보안 없음","var(--red)"),bar(7.0,"RAGuard","var(--ink)"),bar(6.0,"이론상 최선*","var(--line-strong)")],
        take:"RAGuard는 함정 문서 291개 중 289개(99.3%)를 찾아냈고, 거부율을 이론상 최선에 가깝게 낮췄어요." },
      { tag:"실험 3 · 다시 답하게 하기", t:"거부됐던 질문 252개 중 다시 답한 비율 (%)", bars:[bar(94.0,"이론상 최선*","var(--line-strong)"),bar(93.3,"RAGuard (문서째 빼기)","var(--green)"),bar(4.4,"문장만 지우기","var(--line-strong)")],
        take:"함정 문서를 통째로 빼고 새 자료로 채우는 방식이 93.3%를 되살렸어요. 함정이 없는 평범한 질문 350개 중에서 괜히 거부된 건 1개(0.3%)뿐이었어요." },
    ];
    app.innerHTML = `<div class="top"><button class="back" id="bk">← 처음으로</button><span style="font-size:18px">${wm}</span></div>
      <h1 style="margin-top:6px">실험 결과</h1>
      <p class="muted" style="font-size:12px;margin-top:4px;line-height:1.55">* 이론상 최선: 어느 문서가 함정인지 정답을 미리 알고 뺀 경우</p>
      ${charts.map(c => `<section><div style="border-bottom:2px solid var(--ink);padding-bottom:6px"><div class="eyebrow">${c.tag}</div><div style="font-size:16px;font-weight:700;margin-top:2px">${c.t}</div></div>
        <div class="chart">${c.bars.map(b => `<div><span style="font-weight:700">${b.v.toFixed(1)}</span><span style="height:${Math.max(2,b.v*1.25)}px;background:${b.c}"></span></div>`).join("")}</div>
        <div class="clab">${c.bars.map(b => `<div>${b.l}</div>`).join("")}</div>
        <p style="font-size:13px">${c.take}</p></section>`).join("")}
      <p class="faint" style="font-size:11px;margin-top:18px;line-height:1.6">실험 조건: NQ(BEIR) · Contriever · Llama-3-8B-Instruct · 공격 질의 302개 · 규칙 기반 판정(잠정치)</p>
      <section><div class="rule">참고 논문</div>${PAPER}</section>
      <button class="cta" id="try">직접 해보기 →</button>`;
    document.getElementById("bk").onclick = () => go("#/");
    document.getElementById("try").onclick = () => go("#/q");
    window.scrollTo(0, 0);
  }

  function route(){
    closeSheet(); run++;
    const h = location.hash || "#/";
    const m = h.match(/^#\/r\/(test\d+)/);
    if (m) return result(m[1]);
    if (h.startsWith("#/q")) return list();
    if (h.startsWith("#/stats")) return stats();
    intro();
  }
  route();
})();
</script>
</body>
</html>
